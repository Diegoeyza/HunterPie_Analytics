name: Release

# Builds every shareable artifact on a Windows runner and attaches them to a
# GitHub Release. PyInstaller and Inno Setup cannot cross-compile, so the whole
# pipeline is Windows-only.
#
# Signing: fill the SIGNPATH_* secrets to enable SignPath code signing. Without
# them the release is built unsigned (still installable, but SmartScreen/AV
# will warn until the Store listing or a certificate covers it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  fork:
    runs-on: windows-latest
    steps:
      # The `Localization` submodule holds Languages/*.xml. Without it the built
      # companion is missing Languages/en-us.xml and crashes at startup.
      - uses: actions/checkout@v4
        with:
          repository: Diegoeyza/HunterPie
          ref: analytics-export
          path: fork
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: >
          dotnet publish fork/HunterPie/HunterPie.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o publish
      - name: Stage localization
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish\Languages | Out-Null
          Copy-Item fork\Localization\localization\*.xml publish\Languages\
          if (-not (Test-Path publish\Languages\en-us.xml)) {
            throw "Localization submodule missing: publish\Languages\en-us.xml not found"
          }
      - shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath HunterPie-AnalyticsFork.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hunterpie-fork
          path: HunterPie-AnalyticsFork.zip
          if-no-files-found: error

  app:
    needs: fork
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hunterpie-fork
      # The installer bundles the companion from this CI artifact
      # (dist\HunterPie-Fork). It is not published as a standalone release asset.
      - name: Stage fork for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\HunterPie-Fork | Out-Null
          Expand-Archive HunterPie-AnalyticsFork.zip -DestinationPath dist\HunterPie-Fork -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard (static export)
        working-directory: dashboard
        env:
          NEXT_OUTPUT: export
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: >
          python -m pip install
          -r backend/requirements.txt
          -r packaging/requirements-pack.txt

      - name: PyInstaller (onedir)
        run: python -m PyInstaller --noconfirm --clean packaging/HunterPieAnalytics.spec

      # SignPath signs an uploaded artifact and returns the signed copy: upload
      # the unsigned onedir build first. Enable by adding the SIGNPATH_* secrets.
      - name: Upload unsigned app
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/HunterPieAnalytics
          if-no-files-found: error

      # `secrets` is not a valid context in a step `if`, so detect the token
      # via env and expose it as a step output instead.
      - name: Detect SignPath config
        id: signpath
        shell: bash
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SignPath (optional)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/HunterPieAnalytics

      - name: Inno Setup installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\HunterPieAnalytics.iss

      # MSIX/Store build is not published; build it locally with
      # packaging\msix\build-msix.ps1 if you need it.

      - name: HuntDumper (Lua) zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path reframework\hunt_dumper.lua -Pattern '^local VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          # Nexus/Vortex bundle (game-folder layout).
          New-Item -ItemType Directory -Force dist\nexus\reframework\autorun | Out-Null
          Copy-Item reframework\hunt_dumper.lua dist\nexus\reframework\autorun
          Copy-Item packaging\nexus\README.txt dist\nexus
          Compress-Archive -Path dist\nexus\* -DestinationPath "dist\HuntDumper-$ver.zip" -Force

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in ".exe", ".zip" }
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          Set-Content dist\SHA256SUMS.txt ($lines -join "`n")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          # Pre-pended to the auto-generated notes (see the action docs).
          body: |
            ## Which file do I need?

            | File | What it's for |
            |------|---------------|
            | **`HunterPieAnalytics-Setup-*.exe`** | **Start here.** One-click install (per-user, no admin): the dashboard, the HunterPie companion, and the REFramework mod. |
            | **`HuntDumper-*.zip`** | Just the in-game REFramework mod. Extract into the game folder (Vortex-ready). |
            | `SHA256SUMS.txt` | Checksums for the two files above. |

            **Players:** run `HunterPieAnalytics-Setup-*.exe`.
            **In-game mod only:** `HuntDumper-*.zip` →
            `<game>\reframework\autorun\hunt_dumper.lua`.

            > **Windows SmartScreen / antivirus:** the installer is **not code
            > signed**, so Windows may show "Windows protected your PC"
            > (*More info → Run anyway*), and some AV tools may flag the
            > PyInstaller bundle. Verify downloads with `SHA256SUMS.txt`.
