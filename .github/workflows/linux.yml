name: Linux bundle
run-name: Linux bundle ${{ inputs.tag || github.ref_name }}

# Builds the Linux (Proton / Steam Deck) tarball and attaches it to the release
# that `release.yml` just published. Kept separate from the Windows job: it must
# run on ubuntu-22.04 (glibc 2.35) because the frozen Python can only run on
# glibc >= the build machine's.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the bundle to (default: latest)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r packaging/requirements-pack.txt
          npm ci --prefix dashboard

      - name: Build tarball
        run: ./packaging/build-linux.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterPieAnalytics-linux
          path: dist/linux/HunterPieAnalytics-linux-*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "Attaching to $tag"

          # The Windows job generated SHA256SUMS.txt before this asset existed.
          # Pull every payload back, add the tarball, and re-upload the sums so
          # one file covers all downloads.
          rm -rf sums && mkdir sums
          gh release download "$tag" -D sums --clobber \
            -p 'HunterPieAnalytics-Setup-*' \
            -p 'HuntDumper-*.zip' \
            -p 'HunterPieAnalytics-linux-*'
          ( cd sums && sha256sum * > SHA256SUMS.txt )

          gh release upload "$tag" dist/linux/HunterPieAnalytics-linux-*.tar.gz --clobber
          gh release upload "$tag" sums/SHA256SUMS.txt --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
