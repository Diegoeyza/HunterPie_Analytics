name: Linux bundle
run-name: Linux bundle ${{ inputs.tag || github.ref_name }}

# Builds the Linux (Proton / Steam Deck) tarball and attaches it to the release
# that `release.yml` just published. Kept separate from the Windows job: it must
# run on ubuntu-22.04 (glibc 2.35) because the frozen Python can only run on
# glibc >= the build machine's.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundle to (default: latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r packaging/requirements-pack.txt
          npm ci --prefix dashboard

      - name: Build tarball
        run: ./packaging/build-linux.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterPieAnalytics-linux
          path: dist/linux/HunterPieAnalytics-linux-*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "Attaching to $tag"

          # A `release: published` event can fire before the Windows job has
          # finished uploading, so wait for its payloads before checksumming.
          for i in $(seq 1 40); do
            names="$(gh release view "$tag" --json assets --jq '.assets[].name' || true)"
            if echo "$names" | grep -q '^HunterPieAnalytics-Setup-' \
               && echo "$names" | grep -q '^HuntDumper-'; then
              break
            fi
            echo "waiting for the Windows assets… ($i/40)"
            sleep 10
          done

          # Upload the tarball first, then rebuild SHA256SUMS.txt from every
          # release payload (the Windows job generated it before this asset
          # existed). One sums file covers all downloads.
          gh release upload "$tag" dist/linux/HunterPieAnalytics-linux-*.tar.gz --clobber

          rm -rf sums && mkdir sums
          gh release download "$tag" -D sums --clobber \
            -p 'HunterPieAnalytics-Setup-*' \
            -p 'HuntDumper-*.zip' \
            -p 'HunterPieAnalytics-Companion-*' \
            -p 'HunterPieAnalytics-linux-*'
          ( cd sums && sha256sum * > SHA256SUMS.txt )

          gh release upload "$tag" sums/SHA256SUMS.txt --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
