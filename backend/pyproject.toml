[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # long lines: SQL/JSX-adjacent readability over width
  "B008",  # Depends(...) in defaults is canonical FastAPI
  "E731",  # pre-existing lambda style in legacy tests
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
